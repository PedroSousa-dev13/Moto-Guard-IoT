# =============================================================================
# MotoGuard IoT — Docker Compose (Infraestrutura apenas)
# =============================================================================
# Uso: docker compose -f docker-compose.infra.yml up -d
#
# Arranca apenas a infraestrutura necessária para desenvolvimento local:
#   · mosquitto  — Broker MQTT
#   · postgres   — Base de dados relacional
#   · influxdb   — Base de dados de séries temporais
#   · simulador  — Gerador de telemetria MQTT
#
# Depois corre as apps localmente (com hot reload automático):
#   Terminal 1 (backend):  cd app && npm run dev
#   Terminal 2 (frontend): cd app/frontend && npm run dev
#
# O backend local liga-se a:
#   · MQTT:     localhost:1883  (padrão em env.ts)
#   · Postgres: localhost:5432  (padrão em env.ts)
#   · InfluxDB: localhost:8086  (padrão em env.ts)
# Não é necessária nenhuma variável de ambiente extra.
# =============================================================================

services:

  # ─── MQTT Broker ────────────────────────────────────────────────────────
  mosquitto:
    build:
      context: ./docker/mosquitto
      dockerfile: Dockerfile
    container_name: motoguard-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT (backend local liga aqui)
      - "9001:9001"   # WebSocket MQTT
    environment:
      MQTT_USER: motoguard
      MQTT_PASS: motoguard123
      MQTT_SIM_USER: simulator
      MQTT_SIM_PASS: simulator123
      MQTT_BACK_USER: backend
      MQTT_BACK_PASS: backend123
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - motoguard-net

  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: motoguard-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"   # Postgres (backend local liga aqui)
    environment:
      POSTGRES_USER: motoguard
      POSTGRES_PASSWORD: motoguard123
      POSTGRES_DB: motoguard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - motoguard-net

  # ─── InfluxDB ────────────────────────────────────────────────────────────
  influxdb:
    image: influxdb:2
    container_name: motoguard-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"   # InfluxDB (backend local liga aqui)
    environment:
      # DOCKER_INFLUXDB_INIT_MODE only needed on first run (fresh volume).
      # Keeping it set to "setup" on an already-initialized volume causes exit code 2.
      # Uncomment the block below only when starting with a clean volume.
      # DOCKER_INFLUXDB_INIT_MODE: setup
      # DOCKER_INFLUXDB_INIT_USERNAME: motoguard
      # DOCKER_INFLUXDB_INIT_PASSWORD: motoguard123
      # DOCKER_INFLUXDB_INIT_ORG: motoguard
      # DOCKER_INFLUXDB_INIT_BUCKET: motoguard_telemetry
      # DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: motoguard-dev-token
      # DOCKER_INFLUXDB_INIT_RETENTION: 30d
      INFLUXDB_HTTP_AUTH_ENABLED: "true"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - motoguard-net

  # ─── Simulador Python ────────────────────────────────────────────────────
  simulador:
    build:
      context: ./simulador
      dockerfile: Dockerfile
    container_name: motoguard-simulador
    restart: unless-stopped
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: simulator
      MQTT_PASS: simulator123
      SIM_MODELO: Naked
      ROUTE_NAME: vila_real_estrada
    depends_on:
      - mosquitto
    networks:
      - motoguard-net

# ─── Volumes ──────────────────────────────────────────────────────────────
volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  influxdb-config:
  postgres-data:

# ─── Rede interna ─────────────────────────────────────────────────────────
networks:
  motoguard-net:
    driver: bridge
