# =============================================================================
# MotoGuard IoT — Docker Compose
# =============================================================================
# Serviços:
#   1. mosquitto   — Broker MQTT (Eclipse Mosquitto)
#   2. influxdb    — Base de dados de séries temporais (telemetria)
#   3. postgres    — Base de dados relacional (utilizadores, viagens)
#   4. backend     — API Node.js (Express + TypeScript)
# =============================================================================

services:
  # ─── MQTT Broker ────────────────────────────────────────────────────────
  mosquitto:
    build:
      context: ./docker/mosquitto
      dockerfile: Dockerfile
    container_name: motoguard-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883" # MQTT
      - "${MQTT_WS_PORT:-9001}:9001" # WebSocket (para frontend)
    environment:
      MQTT_USER: ${MQTT_USER:-motoguard}
      MQTT_PASS: ${MQTT_PASS:-motoguard123}
      MQTT_SIM_USER: ${MQTT_SIM_USER:-simulator}
      MQTT_SIM_PASS: ${MQTT_SIM_PASS:-simulator123}
      MQTT_BACK_USER: ${MQTT_BACK_USER:-backend}
      MQTT_BACK_PASS: ${MQTT_BACK_PASS:-backend123}
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - motoguard-net
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -E || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── InfluxDB (Telemetria) ─────────────────────────────────────────────
  influxdb:
    image: influxdb:2
    container_name: motoguard-influxdb
    restart: unless-stopped
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-motoguard}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-motoguard123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-motoguard}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-motoguard_telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-motoguard-dev-token}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    networks:
      - motoguard-net
    healthcheck:
      test: ["CMD-SHELL", "influx ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL (Utilizadores, Viagens) ────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: motoguard-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-motoguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motoguard123}
      POSTGRES_DB: ${POSTGRES_DB:-motoguard}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - motoguard-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-motoguard} -d ${POSTGRES_DB:-motoguard}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ─── Backend Node.js ───────────────────────────────────────────────────
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: motoguard-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000" # Backend API
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # MQTT
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_USER: ${MQTT_BACK_USER:-backend}
      MQTT_PASS: ${MQTT_BACK_PASS:-backend123}
      MQTT_TOPIC_TELEMETRIA: ${MQTT_TOPIC_TELEMETRIA:-motoguard/telemetria}
      MQTT_TOPIC_COMANDO: ${MQTT_TOPIC_COMANDO:-motoguard/comando}
      # InfluxDB
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-motoguard-dev-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-motoguard}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-motoguard_telemetry}
      # PostgreSQL
      DATABASE_URL: postgresql://${POSTGRES_USER:-motoguard}:${POSTGRES_PASSWORD:-motoguard123}@postgres:5432/${POSTGRES_DB:-motoguard}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-motoguard-dev-secret-change-in-prod}
      # Encryption (separate from JWT_SECRET!)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-generate-32-byte-random-hex-string}
      # App URL & Email (Resend)
      APP_URL: ${APP_URL:-http://localhost:5173}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # ML Pipeline
      ML_ENABLED: ${ML_ENABLED:-true}
      ML_MODEL_PATH: ${ML_MODEL_PATH:-ml/models/isolation_forest.pkl}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      # NOTA: Montar o source em cima do container faz override do dist/ compilado.
      # Em ambiente de desenvolvimento é útil para hot-reload, mas em produção
      # deve ser removido para usar o código compilado no container.
      - ./app/backend:/app/backend
      - ./app/frontend/dist:/app/frontend/dist
      - ./ml:/ml
    networks:
      - motoguard-net

  # ─── ML Trainer ───────────────────────────────────────────────────────────
  ml-trainer:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: motoguard-ml-trainer
    profiles:
      - ml
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-motoguard}:${POSTGRES_PASSWORD:-motoguard123}@postgres:5432/${POSTGRES_DB:-motoguard}
    volumes:
      - ./ml:/ml
    networks:
      - motoguard-net
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Simulador Python (gera telemetria MQTT) ────────────────────────────
  simulador:
    build:
      context: ./simulador
      dockerfile: Dockerfile
    container_name: motoguard-simulador
    restart: unless-stopped
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_SIM_USER:-simulator}
      MQTT_PASS: ${MQTT_SIM_PASS:-simulator123}
      SIM_MODELO: ${SIM_MODELO:-Naked}
      SIM_AUTO_START: "${SIM_AUTO_START:-false}"
      ROUTE_NAME: ${ROUTE_NAME:-vila_real_estrada}
      ROUTE_SNAP_TO_ROADS: ${ROUTE_SNAP_TO_ROADS:-true}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
    depends_on:
      mosquitto:
        condition: service_started
    volumes:
      - ./simulador:/simulador
    networks:
      - motoguard-net

  # ─── Frontend React (Vite dev server) ────────────────────────────────────
  # NOTA: O frontend é buildado dentro do container do backend (Dockerfile)
  # Este serviço é mantido apenas para desenvolvimento com hot-reload
  # Para usar: docker compose --profile dev up frontend
  frontend:
    image: node:20-alpine
    container_name: motoguard-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./app/frontend:/app
      - frontend-node-modules:/app/node_modules
    networks:
      - motoguard-net
    profiles:
      - dev

# ─── Volumes persistentes ──────────────────────────────────────────────────
volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  influxdb-config:
  postgres-data:
  frontend-node-modules: # cache de node_modules do frontend (evita reinstalação)

# ─── Rede interna ──────────────────────────────────────────────────────────
networks:
  motoguard-net:
    driver: bridge
