


# =============================================================================
# MotoGuard IoT — Mosquitto ACL (Access Control List)
# =============================================================================
# Define quem pode publicar/subscrever em cada tópico.
# Formato:
#   user <username>
#   topic read|write|readwrite <pattern>
#
# Patterns suportados:
#   # → qualquer número de sub-níveis  (ex: motoguard/#)
#   + → exatamente um sub-nível        (ex: motoguard/+/telemetria)
# =============================================================================

# ─── Utilizador: motoguard (simulador + backend) ────────────────────────────
# Pode ler e escrever em todos os tópicos do MotoGuard.
user motoguard
topic readwrite motoguard/#

# ─── Utilizador: simulator (se quiser isolar o simulador) ───────────────────
# Só publica telemetria e lê comandos.
user simulator
topic write motoguard/telemetria
topic read motoguard/comando

# ─── Utilizador: backend ────────────────────────────────────────────────────
# Subscreve telemetria, publica comandos e alertas.
user backend
topic read motoguard/telemetria
topic write motoguard/comando
topic readwrite motoguard/alertas
topic readwrite motoguard/trips/#
