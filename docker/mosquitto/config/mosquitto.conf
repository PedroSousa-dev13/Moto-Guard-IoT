# =============================================================================
# MotoGuard IoT — Mosquitto Configuration
# =============================================================================
# Broker MQTT local para comunicação entre simulador ↔ backend ↔ frontend.
# Autenticação obrigatória (Mosquitto 2.x exige listener + auth explícito).
# =============================================================================

# ─── Configurações Globais (ANTES dos listeners — Mosquitto 2.x) ────────────
# NOTA: auth e ACL devem estar antes dos listeners para aplicar globalmente.

# ─── Autenticação ────────────────────────────────────────────────────────────
# Ficheiro de passwords gerado automaticamente pelo entrypoint.sh
# Formato: username:$7$hash  (criado com mosquitto_passwd)
allow_anonymous false
password_file /mosquitto/config/password.txt

# ─── ACL (Controlo de Acesso por Tópico) ────────────────────────────────────
acl_file /mosquitto/config/acl.conf

# ─── Listener MQTT (porta 1883) ──────────────────────────────────────────────
listener 1883
protocol mqtt

# ─── Listener WebSocket (porta 9001 — para frontend React) ──────────────────
listener 9001
protocol websockets

# ─── Persistência ────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ─── Logs ────────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type warning
log_type error
log_type notice
log_type subscribe
log_type unsubscribe
connection_messages true
